name: Tenet Industries
description: >-
  Tenet Industries is a Swedish defense-technology startup founded in 2026 by
  Hugo Frisk, Fabian Andersson, and Emil Falk (students from KTH Royal Institute
  of Technology and the Stockholm School of Economics) building low-cost,
  mass-producible defense systems. Applying design-for-manufacturing and
  first-principles engineering, the company starts with strike/attack drones —
  a kamikaze quadcopter that assembles in two minutes with roughly half the
  parts of comparable systems — and extends the same hardware/software platform
  to loitering munitions, jammers, radars, and missile systems. Backed by
  Y Combinator ($500K). As a defense hardware manufacturer, Tenet Industries
  currently publishes no public API, SDK, developer portal, or event surface;
  this profile is maintained as a company record in the API Evangelist network.
